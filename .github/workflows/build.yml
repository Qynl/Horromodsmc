name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The repo has no committed Gradle wrapper, so provision Gradle directly
      # (the version BUILDING.md pins for this project).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      - name: Report failure to commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### :x: Build failed'
            echo '#### What went wrong'
            echo '```'
            grep -A 30 "What went wrong" /tmp/build.log | head -40
            echo '```'
            echo '#### Compiler / cause lines'
            echo '```'
            grep -nE "error:|\.java:[0-9]+|Caused by:|Execution failed|Could not (resolve|find|download)|FAILED" /tmp/build.log | head -50
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/comment.md)" >/dev/null || true

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-mod
          path: build/libs/*.jar
          if-no-files-found: error
