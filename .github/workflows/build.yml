name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build mod
        run: |
          set -o pipefail
          gradle build --console=plain 2>&1 | tee build.log

      - name: Publish build errors to job summary
        if: failure()
        run: |
          {
            echo '## Build failure excerpt'
            echo '~~~'
            grep -E -B1 -A4 'error:|What went wrong:|Caused by:|FAILURE:' build.log | head -150 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build errors as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Hollow CI build failed. Error excerpt:"
            echo '~~~'
            grep -E -B1 -A4 'error:|What went wrong:|Caused by:|FAILURE:' build.log | head -100 || true
            echo '~~~'
            echo 'tail of log:'
            echo '~~~'
            tail -60 build.log || true
            echo '~~~'
          } > /tmp/excerpt.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/excerpt.txt)" || true

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: hollow-mod
          path: build/libs/*.jar
          if-no-files-found: error
